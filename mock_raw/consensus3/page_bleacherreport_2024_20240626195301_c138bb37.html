window.INITIAL_STORE_STATE = {"ads":{"cnn":false,"embedded":false,"layout":"default","override":false,"social":"false","krux_id":"ITb9Q03y","article":10125940,"buzz":"top5","division":"none","event":"none","fantasy":"none","gp_flag":"","league":"NBA","render_strategy":"slideshow","site":"NBA","tag_id":19,"tags":"NBA","team":"none","writer":"Jonathan Wasserman","zone":"slideshow"},"articles":{"tracks":[],"amp_url":"https://syndication.bleacherreport.com/amp/10125940-brs-final-2024-nba-mock-draft-full-2-round-predictions.amp.html","author":{"id":"14977252","name":"Jonathan Wasserman","photo_url":"/images/users/br-user-default.png","title":"","twitter_handle":""},"author_gatekeeper_id":"2ac234aa-52f4-4a26-9b4f-23162c159acb","bet_tags":"19","breport_id":10125940,"contains_geoblocked_content":false,"description":"Discussions about prospect targets and trades intensify heading into NBA draft day. There is still an unusual amount of guessing going on about how the top of…","elements":[{"content_type":"slide","elements":[{"content":{"credit":"Bleacher Report","uploaded_by_user_i_d":"be2080b8-ade5-41db-9cd3-3f9e468fe8ce","url":"https://media.bleacherreport.com/image/upload/x_2,y_0,w_1794,h_1197,c_crop/v1719417441/jfe3g3dszppyxubwpo3j.jpg","user_caption":"We project Alex Sarr as the No. 2 pick in tonight's NBA draft. See who we have at No. 1 below.","user_id":"be2080b8-ade5-41db-9cd3-3f9e468fe8ce"},"content_type":"image","isLeadImage":true},{"content":{"html":"Discussions about prospect targets and trades intensify heading into NBA draft day."},"content_type":"paragraph","id":"l5NAKJULQp"},{"content":{"html":"There is still an unusual amount of guessing going on about how the top of the board will play out."},"content_type":"paragraph","id":"xAQuWR5FZI"},{"content":{"html":"The Atlanta Hawks have multiple options with players and trades. The Houston Rockets are talking to teams about No. 3. The San Antonio Spurs are in trade discussions, potentially with both No. 4 and No. 8."},"content_type":"paragraph","id":"ZV-W0yJnSv"},{"content":{"html":"The interest in Donovan Clingan, who isn't the easiest fit for teams near the top of the draft, has become the biggest storyline heading into Wednesday."},"content_type":"paragraph","id":"jFLCLB6e1g"},{"content":{"html":"We'll continue to keep our ear on the NBA door in the hours leading up until the Hawks make their decision."},"content_type":"paragraph","id":"-wjrH0uRQg"},{"content":{"html":"<i>Some of the analysis is repeated from our previous mock draft published on June 19.</i>"},"content_type":"paragraph","id":"XyjpjoGSQO"}],"id":0,"slide_number":0,"title":"B/R's Final 2024 NBA Mock Draft: Full 2-Round Predictions","user_gk_uuid":"be2080b8-ade5-41db-9cd3-3f9e468fe8ce"},{"content_type":"slide","elements":[{"content":{"credit":"Gioele Mason/NBAE via Getty Images","source_caption":"BOSTON, MA - JUNE 6: Zaccharie Risacher #17 shoots the ball during the 2024 NBA Treviso Draft Combine on June 6, 2024 in Treviso, Italy. NOTE TO USER: User expressly acknowledges and agrees that, by downloading and or using this photograph, User is consenting to the terms and conditions of the Getty Images License Agreement. Mandatory Copyright Notice: Copyright 2024 NBAE (Photo by Gioele Mason/NBAE via Getty Images)","source_credit":"NBA Photos","url":"https://media.bleacherreport.com/image/upload/x_0,y_176,w_1800,h_1196,c_crop/v1719308148/x94aypsm13ygeyinr71a.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<a href=\"https://bleacherreport.com/articles/10125089-2024-nba-mock-draft-full-2-round-predictions-with-one-week-to-go\"><b>June 19 Mock Draft Spot</b></a><b><a href=\"https://bleacherreport.com/articles/10123676-2024-nba-mock-draft-full-2-round-predictions-and-pro-comparisons\"></a>: </b>No. 1"},"content_type":"paragraph","id":"zPik0Fqw6R"},{"content":{"html":"<b>Team</b>: JL Bourg-en-Bresse"},"content_type":"paragraph","id":"2YflEDdcR1"},{"content":{"html":"<b>Position</b>: SG/SF"},"content_type":"paragraph","id":"14__ZAyZOw"},{"content":{"html":"<b>Size</b>: 6'8\", 204 lbs"},"content_type":"paragraph","id":"a7UJprK2yM"},{"content":{"html":"<b>Age</b>: 19"},"content_type":"paragraph","id":"ZxjpWN14fh"},{"content":{"html":"<b>Nationality</b>: French"},"content_type":"paragraph","id":"3FkEfo0ixw"},{"content":{"html":"<b>Pro Comparison: </b>Harrison Barnes"},"content_type":"paragraph","id":"hQHnPRlmNC"},{"content":{"html":"The Atlanta Hawks have worked out Donovan Clingan and Matas Buzelis. And despite failing to get Alex Sarr in the building, sources tell Bleacher Report that Sarr is higher on Atlanta's board than both."},"content_type":"paragraph","id":"P-rFaJypWz"},{"content":{"html":"Still, Zaccharie Risacher remains the projected pick at No. 1 if the Hawks stick."},"content_type":"paragraph","id":"cr3bMmFEe5"},{"content":{"html":"While scouts continue to debate the height of his ceiling, there is a perceived level of certainty tied to his positional size, shooting and defensive tools/quickness. That could sway the Hawks to lean Risacher's way without a sure-thing star at the top. Injury problems with Saddiq Bey and AJ Griffin could also help the case for Risacher to Atlanta."},"content_type":"paragraph","id":"YP0PL6zc2y"}],"id":1,"slide_number":1,"title":"1. Atlanta Hawks: Zaccharie Risacher","user_gk_uuid":"ad7dcecb-2f27-48a1-887b-5e012e126aaf"},{"content_type":"slide","elements":[{"content":{"credit":"COLIN MURTY/AFP via Getty Images","source_caption":"French basketball player Alexandre Sarr of the Perth Wildcats enters the court before playing against the Tasmania Jackjumpers during an Australian National Basketball League game at Perth Arena in Perth on March 8, 2024. (Photo by COLIN MURTY / AFP) / -- IMAGE RESTRICTED TO EDITORIAL USE - STRICTLY NO COMMERCIAL USE -- (Photo by COLIN MURTY/AFP via Getty Images)","source_credit":"COLIN MURTY","url":"https://media.bleacherreport.com/image/upload/v1719308207/jdgrdkjojruphwsktnzi.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>June 19 Mock Draft Spot: </b>No. 2"},"content_type":"paragraph","id":"gYzZbC5fMB"},{"content":{"html":"<b>Team</b>: Perth Wildcats"},"content_type":"paragraph","id":"EFeot58ENc"},{"content":{"html":"<b>Position</b>: PF/C"},"content_type":"paragraph","id":"CV9nuTWeJI"},{"content":{"html":"<b>Size</b>: 7'0\", 224 lbs"},"content_type":"paragraph","id":"VaKDVVa4oP"},{"content":{"html":"<b>Age</b>: 19"},"content_type":"paragraph","id":"e2o7mb4jRO"},{"content":{"html":"<b>Nationality</b>: French"},"content_type":"paragraph","id":"FYp5mEj4Tw"},{"content":{"html":"<b>Pro Comparison:</b> Evan Mobley"},"content_type":"paragraph","id":"dm_VDi7KRx"},{"content":{"html":"Teams and agents believe that if the Atlanta Hawks don't draft Alex Sarr, the Washington Wizards will take him at No. 2. Washington has also shown interest in Matas Buzelis."},"content_type":"paragraph","id":"uZAfepP8lU"},{"content":{"html":"Though some scouts and executives have questioned Sarr's offensive polish for a top pick, the Wizards are expected to be patient during its rebuild."},"content_type":"paragraph","id":"Tt1sRKi79g"},{"content":{"html":"The rise and success of defensive bigs with perimeter skill sets—Evan Mobley, Jaren Jackson Jr., Chet Holmgren, Victor Wembanyama—adds to the allure of Sarr."},"content_type":"paragraph","id":"tveuSPU8K1"},{"content":{"html":"He measured well in Chicago, coming in at just under 7'0\" in socks, 224 pounds with a 7'4\" wingspan. At that size, the ability to slide his feet, handle in the open floor and shoot off the dribble separates him from other centers."},"content_type":"paragraph","id":"2nEZzpWEtT"},{"content":{"html":"The Wizards will eventually need to find a point guard, but at No. 2, Sarr's physical talent, evolving skill versatility and defense create visions of upside that could be difficult to resist."},"content_type":"paragraph","id":"lx3CS6qhra"}],"id":2,"slide_number":2,"title":"2. Washington Wizards: Alex Sarr","user_gk_uuid":"ad7dcecb-2f27-48a1-887b-5e012e126aaf"},{"content_type":"slide","elements":[{"content":{"credit":"Michael Hickey/Getty Images","source_caption":"LEXINGTON, KENTUCKY - MARCH 6:  Reed Sheppard #15 of the Kentucky Wildcats brings the ball up court during the game against the Vanderbilt Commodores at Rupp Arena on March 6, 2024 in Lexington, Kentucky. (Photo by Michael Hickey/Getty Images)","source_credit":"Michael Hickey","url":"https://media.bleacherreport.com/image/upload/x_0,y_0,w_1800,h_1198,c_crop/v1719350203/khwtrdjgc0puwcjb0epk.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>June 19 Mock Draft Spot</b>: No. 3"},"content_type":"paragraph","id":"Qi8Ec1DqnG"},{"content":{"html":"<b>Team</b>: Kentucky"},"content_type":"paragraph","id":"Pwbt17I9W7"},{"content":{"html":"<b>Position</b>: PG/SG"},"content_type":"paragraph","id":"RE6Rcf4cCN"},{"content":{"html":"<b>Size</b>: 6'2\", 182 lbs"},"content_type":"paragraph","id":"VOHcB06WKY"},{"content":{"html":"<b>Age/Year</b>: 20, Freshman"},"content_type":"paragraph","id":"TbLDefWHYR"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"YkYceUVsv3"},{"content":{"html":"<b>Pro Comparison: </b>Donte DiVincenzo"},"content_type":"paragraph","id":"zY3pSLp0rN"},{"content":{"html":"League sources say the No. 3 pick continues to be shopped. It just may be challenging to find a trade partner with the perceived difference between No. 3 and the late lottery being minimal."},"content_type":"paragraph","id":"tp05dyVpy-"},{"content":{"html":"If the Rockets stick, they should love what Reed Sheppard brings to their rotation: elite shooting, passing and intangibles/character that scouts and executives praised after interviewing him at the NBA combine."},"content_type":"paragraph","id":"CPNXjXYzEh"},{"content":{"html":"For Sheppard, an undersized 2 who's more limited off the dribble, Amen Thompson would also be the ideal backcourt partner with his creation/playmaking and ability to defend bigger guards."},"content_type":"paragraph","id":"6JWOhRFD83"},{"content":{"html":"And Sheppard feels perfect for Thompson with his ability to stretch the floor and create space for a limited shooter and shifty ball-handler."},"content_type":"paragraph","id":"Qfx9Et65vG"}],"id":3,"slide_number":3,"title":"3. Houston Rockets (via Nets): Reed Sheppard","user_gk_uuid":"ad7dcecb-2f27-48a1-887b-5e012e126aaf"},{"content_type":"slide","elements":[{"content":{"credit":"Set Number: X00004 TK1","source_caption":"College Basketball: NCAA Final Four: UConn Stephon Castle (5) in action, dribbles vs Purdue during the NCAA Men's Basketball Tournament National Championship game at State Farm Stadium. \nGlendale, AZ 4/8/2024 \nCREDIT: Greg Nelson (Photo by Greg Nelson/Sports Illustrated via Getty Images) \n(Set Number: X00004 TK1)","source_credit":"Greg Nelson","url":"https://media.bleacherreport.com/image/upload/v1719350227/ax76fj4donadzs9aivci.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>June 19 Mock Draft Spot</b>: No. 4"},"content_type":"paragraph","id":"Ep4xq_v3Vm"},{"content":{"html":"<b>Team</b>: Connecticut"},"content_type":"paragraph","id":"q3Y4In_hvl"},{"content":{"html":"<b>Position</b>: SG"},"content_type":"paragraph","id":"emHqZKKUDe"},{"content":{"html":"<b>Size</b>: 6'6\", 210 lbs"},"content_type":"paragraph","id":"LqtGJPWi-a"},{"content":{"html":"<b>Age/Year</b>: 19, Freshman"},"content_type":"paragraph","id":"h-bBSHPvkh"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"lglMVx6s5H"},{"content":{"html":"<b>Pro Comparison: </b>Anthony Black"},"content_type":"paragraph","id":"kXOg2CiW4y"},{"content":{"html":"Every team in the lottery will discuss Stephon Castle. They're all going to covet the idea of a 6'6\" defensive stopper who handles the ball and passes, possesses great positional strength and just needs some improved shooting touch to unlock a unique potential trajectory and archetype."},"content_type":"paragraph","id":"2hy4nUr2ey"},{"content":{"html":"His camp has gone dark since the NBA combine. There's no indication that he's worked out for anyone, and if he has, it's been kept quiet. It's possible Castle has some assurance about where he'll be taken. San Antonio figures to be a desirable destination for any prospect, particularly Castle, who'll get to play more on the ball for a Spurs team lacking a cornerstone point guard."},"content_type":"paragraph","id":"nIsRgbjf5z"}],"id":4,"slide_number":4,"title":"4. San Antonio Spurs: Stephon Castle","user_gk_uuid":"ad7dcecb-2f27-48a1-887b-5e012e126aaf"},{"content_type":"slide","elements":[{"content":{"credit":"Mitchell Layton/Getty Images","source_caption":"GLENDALE, ARIZONA - APRIL 08:  Donovan Clingan #32 of the Connecticut Huskies celebrates during the National College Basketball Championship game against the Purdue Boilermakers at State Farm Stadium on April 08, 2024 in Glendale, Arizona.  (Photo by Mitchell Layton/Getty Images)","source_credit":"Mitchell Layton","url":"https://media.bleacherreport.com/image/upload/v1719361248/hebtbukee1v0xkzoctme.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>June 19 Mock Draft Spot</b>: No. 6"},"content_type":"paragraph","id":"A-IBt7dwLC"},{"content":{"html":"<b>Team</b>: Connecticut"},"content_type":"paragraph","id":"IHVCvxwCv7"},{"content":{"html":"<b>Position</b>: C"},"content_type":"paragraph","id":"VpHQnlTv5s"},{"content":{"html":"<b>Size</b>: 7'2\", 282 lbs"},"content_type":"paragraph","id":"zylC2B0nK2"},{"content":{"html":"<b>Age/Year</b>: 20, Sophomore"},"content_type":"paragraph","id":"ZTrncmynCh"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"EHN4irbUPP"},{"content":{"html":"<b>Pro Comparison: </b>Roy Hibbert"},"content_type":"paragraph","id":"g2iKVnisGR"},{"content":{"html":"Donovan Clingan figures to be a trade-up target, specifically for the Memphis Grizzlies who pick at No. 9."},"content_type":"paragraph","id":"McXIzsbzkc"},{"content":{"html":"For the Detroit Pistons, drafting the best player available will be the priority, particularly with Trajon Langdon taking over, considering the current rosters' young prospects aren't \"his guys.\""},"content_type":"paragraph","id":"kEYDxXTx0j"},{"content":{"html":"Clingan would give Detroit a surefire defensive anchor and some potential trade flexibility with Jalen Duren, who's been up and down to start his career."},"content_type":"paragraph","id":"pMIaV1moz8"}],"id":6,"slide_number":5,"title":"5. Detroit Pistons: Donovan Clingan","user_gk_uuid":"2ac234aa-52f4-4a26-9b4f-23162c159acb"},{"content_type":"slide","elements":[{"content":{"credit":"Nicholas Muller/SOPA Images/LightRocket via Getty Images","source_caption":"DETROIT, UNITED STATES - 2024/03/31: Dalton Knecht (R) of the Tennessee Volunteers in action against Zach Edey (L) of the Purdue Boilermakers in the Elite Eight round of the NCAA Men's Basketball Tournament at Little Caesars Arena. Final score; Purdue 72-66 Tennessee. (Photo by Nicholas Muller/SOPA Images/LightRocket via Getty Images)","source_credit":"SOPA Images","url":"https://media.bleacherreport.com/image/upload/v1719308735/wfp9bchcboaaqf6av0ue.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>June 19 Mock Draft Spot</b>: No. 10"},"content_type":"paragraph","id":"ZRmXhBW3RM"},{"content":{"html":"<b>Team</b>: Tennessee"},"content_type":"paragraph","id":"-c9k8b_KKu"},{"content":{"html":"<b>Position</b>: SG/SF"},"content_type":"paragraph","id":"DG8U7u5g_r"},{"content":{"html":"<b>Size</b>: 6'5\", 212 lbs"},"content_type":"paragraph","id":"9W1iJ2cKAr"},{"content":{"html":"<b>Age/Year</b>: 23, Senior"},"content_type":"paragraph","id":"tiMvgdTv7P"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"s71x1egAFE"},{"content":{"html":"<b>Pro Comparison: </b>Wally Szczerbiak"},"content_type":"paragraph","id":"LNkYEfbqsG"},{"content":{"html":"Sources say the Charlotte Hornets have been high on Dalton Knecht for weeks. He's not in play for the Detroit Pistons at No. 5."},"content_type":"paragraph","id":"3dJAFGO_jg"},{"content":{"html":"There's a sure-thing aspect that comes with drafting Knecht, a special shotmaker with three-level scoring skills, maturity and toughness."},"content_type":"paragraph","id":"1asG3Twcgw"},{"content":{"html":"The Hornets may prefer to grab Stephon Castle or Donovan Clingan, but that could also require moving up."},"content_type":"paragraph","id":"HYG3RUZUEx"}],"id":8,"slide_number":6,"title":"6. Charlotte Hornets: Dalton Knecht","user_gk_uuid":"2ac234aa-52f4-4a26-9b4f-23162c159acb"},{"content_type":"slide","elements":[{"content":{"credit":"Mitchell Layton/Getty Images","source_caption":"INDIANAPOLIS, INDIANA - MARCH 24: Cody Williams #10 of the Colorado Buffaloes dribbles the ball during the Second Round NCAA Men's Basketball Tournament game against the Marquette Golden Eagles at Gainbridge Fieldhouse on March 24, 2024 in Indianapolis, Indiana. (Photo by Mitchell Layton/Getty Images)","source_credit":"Mitchell Layton","url":"https://media.bleacherreport.com/image/upload/v1719308280/ofnntmnl0lna2ut86fxg.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>June 19 Mock Draft Spot</b>: No. 7"},"content_type":"paragraph","id":"FUhQaCqe9A"},{"content":{"html":"<b>Team</b>: Colorado"},"content_type":"paragraph","id":"v8BxQhnP9X"},{"content":{"html":"<b>Position</b>: SF/PF"},"content_type":"paragraph","id":"yqvNn-yhnw"},{"content":{"html":"<b>Size</b>: 6'7\", 178 lbs"},"content_type":"paragraph","id":"AVB2W0mFiA"},{"content":{"html":"<b>Age/Year</b>: 19, Freshman"},"content_type":"paragraph","id":"TZvRaEZiwY"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"9A9NRFIKNC"},{"content":{"html":"<b>Pro Comparison: </b>Jaden McDaniels"},"content_type":"paragraph","id":"0Q6hko9_4p"},{"content":{"html":"Rival teams continue to predict that Cody Williams will be picked earlier than most expect, potentially by the Detroit Pistons at No. 5 or the San Antonio Spurs."},"content_type":"paragraph","id":"oU91pD7mb1"},{"content":{"html":"The pitch to Williams revolves around a coveted, big-wing archetype, his efficiency at Colorado and the belief that he has the mentality and blueprint (being Jalen's brother) to continue improving and maximize his potential."},"content_type":"paragraph","id":"hz7hmAc2vj"}],"id":7,"slide_number":7,"title":"7. Portland Trail Blazers: Cody Williams","user_gk_uuid":"ad7dcecb-2f27-48a1-887b-5e012e126aaf"},{"content_type":"slide","elements":[{"content":{"credit":"Mary Kate Ridgway/NBAE via Getty Images","source_caption":"UNIONDALE, NY - MARCH 5: Matas Buzelis #13 of the G League Ignite drives to the basket during the game against the Long Island Nets on March 5, 2024 at Nassau Coliseum in Uniondale, New York. NOTE TO USER: User expressly acknowledges and agrees that, by downloading and/or using this Photograph, user is consenting to the terms and conditions of the Getty Images License Agreement. Mandatory Copyright Notice: Copyright 2024 NBAE (Photo by Mary Kate Ridgway/NBAE via Getty Images)","source_credit":"Mary Kate Ridgway","url":"https://media.bleacherreport.com/image/upload/x_0,y_546,w_1800,h_1199,c_crop/v1719361311/uiyal63tlz8qgtzvbwrq.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>June 19 Mock Draft Spot</b>: No. 5"},"content_type":"paragraph","id":"MCGvlRuj_2"},{"content":{"html":"<b>Team</b>: G League Ignite"},"content_type":"paragraph","id":"YfAcm52CiL"},{"content":{"html":"<b>Position</b>: SF"},"content_type":"paragraph","id":"LJhBS5lx69"},{"content":{"html":"<b>Size</b>: 6'9\", 197 lbs"},"content_type":"paragraph","id":"CFkz77tL3b"},{"content":{"html":"<b>Age</b>: 19"},"content_type":"paragraph","id":"mLVJWjQxJ-"},{"content":{"html":"<b>Nationality</b>: American/Lithuanian"},"content_type":"paragraph","id":"SLo3GbCOv8"},{"content":{"html":"<b>Pro Comparison:</b> Lamar Odom"},"content_type":"paragraph","id":"nx9H_RJ_yc"},{"content":{"html":"Each of the top six teams except for the Houston Rockets have worked out Matas Buzelis."},"content_type":"paragraph","id":"Dk-cJYZRMi"},{"content":{"html":"We're told he had his best workout for the San Antonio Spurs, but getting more of a playmaker in Stephon Castle could be their priority."},"content_type":"paragraph","id":"sKbl2g-hnk"},{"content":{"html":"Sources also say the Spurs may look to move this pick for a veteran, but assuming they've considered him at No. 4, they'd like be happy to grab him at No. 8 if they stick."},"content_type":"paragraph","id":"LsIRFxDb6e"}],"id":5,"slide_number":8,"title":"8. San Antonio Spurs: Matas Buzelis","user_gk_uuid":"2ac234aa-52f4-4a26-9b4f-23162c159acb"},{"content_type":"slide","elements":[{"content":{"credit":"David Becker/NBAE via Getty Images","source_caption":"LAS VEGAS, NV - JANUARY 31: Ron Holland #0 of G League Ignite  drives to the basket during the game against the Iowa Wolves on January 31, 2024 at The Dollar Loan Center in Henderson, Nevada. NOTE TO USER: User expressly acknowledges and agrees that, by downloading and or using this photograph, User is consenting to the terms and conditions of the Getty Images License Agreement. Mandatory Copyright Notice: Copyright 2024 NBAE (Photo by David Becker/NBAE via Getty Images)","source_credit":"David Becker","url":"https://media.bleacherreport.com/image/upload/x_0,y_579,w_1800,h_1199,c_crop/v1719354732/j61xipsdhk2wqnuuv0ss.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>June 19 Mock Draft Spot</b>: No. 9"},"content_type":"paragraph","id":"IoWoMwJ0fH"},{"content":{"html":"<b>Team</b>: G League Ignite"},"content_type":"paragraph","id":"6VViZHNlk0"},{"content":{"html":"<b>Position< "slide_number":11,"title":"11. Chicago Bulls: Rob Dillingham","user_gk_uuid":"ad7dcecb-2f27-48a1-887b-5e012e126aaf"},{"content_type":"slide","elements":[{"content":{"credit":"Glenn Gervot/Icon Sportswire via Getty Images","source_caption":"PARIS, FRANCE - MAY 21: Tidjane Salaun (31) (Cholet) passes the defense of Justin Simon (23) (Paris) during the French National Basketball League (LNB) playoff match between the Paris Basket and the Cholet Basket at Adidas Arena on May 21, 2024 in Paris, France. (Photo by Glenn Gervot/Icon Sportswire via Getty Images)","source_credit":"Icon Sportswire","url":"https://media.bleacherreport.com/image/upload/v1719358848/vgssqxtp5hppt5ebhxms.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>June 19 Draft Spot: </b>No. 12"},"content_type":"paragraph","id":"FtuGCKszRf"},{"content":{"html":"<b>Team:</b><b> </b>Cholet"},"content_type":"paragraph","id":"6MJgCLjOeb"},{"content":{"html":"<b>Position:</b> PF"},"content_type":"paragraph","id":"Ds9_knc0NN"},{"content":{"html":"<b>Size: </b>6'9\", 212 lbs"},"content_type":"paragraph","id":"_kLDn32l-6"},{"content":{"html":"<b>Age: </b>18"},"content_type":"paragraph","id":"BDRKO_SE11"},{"content":{"html":"<b>Nationality:</b> French"},"content_type":"paragraph","id":"xcez3xeR6b"},{"content":{"html":"<b>Pro comparison:</b> Obi Toppin"},"content_type":"paragraph","id":"CZ_ywsYF7n"},{"content":{"html":"Tidjane Salaun has earned workouts with top-10 teams, including the San Antonio Spurs and Detroit Pistons. The late lottery is now seen as the floor for the 18-year-old forward who made 75 total threes in 54 total games with Cholet."},"content_type":"paragraph","id":"1DEGnGXkJB"},{"content":{"html":"Though the Thunder are officially in win-now mode for a title run, Salaun started playoff games in LNB Pro A. He could be ready for a smaller role, but the same one he had with Cholet, playing to his strength as a rim-runner, finisher and spot-up shooter."},"content_typ de_number":13,"title":"13. Sacramento Kings: Zach Edey","user_gk_uuid":"ad7dcecb-2f27-48a1-887b-5e012e126aaf"},{"content_type":"slide","elements":[{"content":{"credit":"Dylan Buell/Getty Images","source_caption":"INDIANAPOLIS, INDIANA - MARCH 24: Tristan da Silva #23 of the Colorado Buffaloes dunks the ball against the Marquette Golden Eagles during the first half in the second round of the NCAA Men's Basketball Tournament at Gainbridge Fieldhouse on March 24, 2024 in Indianapolis, Indiana. (Photo by Dylan Buell/Getty Images)","source_credit":"Dylan Buell","url":"https://media.bleacherreport.com/image/upload/v1719358882/qazt3ap5xjjpavvpbyah.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>June 19 Mock Draft Spot: </b>No. 14"},"content_type":"paragraph","id":"91fiAhtvJ-"},{"content":{"html":"<b>School/team:</b> Colorado"},"content_type":"paragraph","id":"uOCYCFPlm5"},{"content":{"html":"<b>Position:</b> SF/PF"},"content_type":"paragraph","id":"0YRsarIx-z"},{"content":{"html":"<b>Size: </b>6'8\", 217 lbs"},"content_type":"paragraph","id":"jKP2YYG6DT"},{"content":{"html":"<b>Age/Year:</b> 23, Senior"},"content_type":"paragraph","id":"mpjz_pJNJv"},{"content":{"html":"<b>Nationality:</b> German/Brazilian"},"content_type":"paragraph","id":"zJ5g_1kxYq"},{"content":{"html":"<b>Pro comparison:</b> Kyle Kuzma"},"content_type":"paragraph","id":"Pgg0Udhahz"},{"content":{"html":"Tristan da Silva has visited mid-first-round teams on his workout tour. Teams all seem to like his positional size, shooting versatility and all-around polish, on and off the floor. The question is how much a team <i>loves</i> him."},"content_type":"paragraph","id":"hQouSnm-mZ"},{"content":{"html":"His athletic limitations could restrict him at both ends of the floor, getting to and finishing at the rim or stopping quicker wings and stronger 4s."},"content_type":"paragraph","id":"WDyWJ1Vx08"},{"content":{"html":"Teams valuing safety and shooting over upside could be drawn to da Silva in the late lottery or teens."},"content_type":"paragraph","id":"OVX2VV6SyV"}],"id":14,"slide_number":14,"title":"14. Portland Trail Blazers (via Warriors): Tristan da Silva","user_gk_uuid":"ad7dcecb-2f27-48a1-887b-5e012e126aaf"},{"content_type":"slide","elements":[{"content":{"credit":"Greg Fiume/Getty Images","source_caption":"WASHINGTON, DC - MARCH 15: Carlton Carrington #7 of the Pittsburgh Panthers handles the ball against the North Carolina Tar Heels in the Semifinals of the ACC Men's Basketball Tournament  at Capital One Arena on March 15, 2024 in Washington, DC.  (Photo by Greg Fiume/Getty Images)","source_credit":"Greg Fiume","url":"https://media.bleacherreport.com/image/upload/v1719358897/emypgnznhncdbbhm9lqu.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>June 19 Mock Draft Spot: </b>No. 20"},"content_type":"paragraph","id":"UhqanpDQES"},{"content":{"html":"<b>School/team:</b> Pittsburgh"},"content_type":"paragraph","id":"uNnmWjpC2p"},{"content":{"html":"<b>Position:</b> PG/SG"},"content_type":"paragraph","id":"mEV8ivO4t_"},{"content":{"html":"<b>Size: </b>6'4\", 195 lbs"},"content_type":"paragraph","id":"lGmDZZcG94"},{"content":{"html":"<b>Age:</b> 18, Freshman"},"content_type":"paragraph","id":"0ktXvBI1EX"},{"content":{"html":"<b>Nationality:</b> American"},"content_type":"paragraph","id":"gmeSwDwJZ-"},{"content":{"html":"<b>Pro comparison:</b> Tyrese Maxey"},"content_type":"paragraph","id":"smOapl1-th"},{"content":{"html":"Bub Carrington's stock feels hot right now, with teams questioning if he has a promise, and others asking if he'll be there for them in the 20s."},"content_type":"paragraph","id":"_Uyx95EQZC"},{"content":{"html":"He's one of the draft's youngest prospects, and he has positional size, serious shotmaking production and enough passing ability for teams to picture a point guard."},"content_type":"paragraph","id":"FdhgMFkrKo"},{"content":{"html":"He didn't get to the rim much, and a <a href=\"https://www.sports-reference.com/cbb/players/carlton-carrington-1.html\" rel=\"noopener\" target=\"_blank\">1.0 steal rate</a> highlights some real concerns over his quickness for a guard. But teams won't overthink athleticism or numbers as much this late in this particular draft."},"content_type":"paragraph","id":"PTqP1JTDwe"}],"id":15,"slide_number":15,"title":"15. Miami Heat: Bub Carrington","user_gk_uuid":"2ac234aa-52f4-4a26-9b4f-23162c159acb"},{"content_type":"slide","elements":[{"content":{"credit":"Patrick Smith/Getty Images","source_caption":"DALLAS, TEXAS - MARCH 31:  Jared McCain #0 of the Duke Blue Devils drives to the basket as DJ Horne #0 of the North Carolina State Wolfpack defends  in the Elite 8 round of the NCAA Men's Basketball Tournament at American Airlines Center on March 31, 2024 in Dallas, Texas. (Photo by Patrick Smith/Getty Images)","source_credit":"Patrick Smith","url":"https://media.bleacherreport.com/image/upload/v1719359065/hpn05xr8e3hqsliwz7qd.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>June 19 Mock Draft Spot</b>: No. 18"},"content_type":"paragraph","id":"krljKZdiVd"},{"content":{"html":"<b>Team</b>: Duke"},"content_type":"paragraph","id":"ANFsQeX6FG"},{"content":{"html":"<b>Position</b>: PG/SG"},"content_type":"paragraph","id":"W54rntME2d"},{"content":{"html":"<b>Size</b>: 6'2\", 203 lbs"},"content_type":"paragraph","id":"9RMA3bBwoT"},{"content":{"html":"<b>Age/Year</b>: 20, Freshman"},"content_type":"paragraph","id":"kUHbRF19ym"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"G6vv3vEM0K"},{"content":{"html":"<b>Pro Comparison: </b>Immanuel Quickley"},"content_type":"paragraph","id":"Nj005mfPpj"},{"content":{"html":"Shotmaking has and will always be what powers Jared McCain's offense and value, but his effectiveness this year in ball-screen situations, using change of speed, footwork, crafty finishing and vision, point to more on-ball u
