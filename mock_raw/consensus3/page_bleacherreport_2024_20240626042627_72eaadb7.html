window.INITIAL_STORE_STATE = {"ads":{"cnn":false,"embedded":false,"layout":"default","override":false,"social":"false","krux_id":"ITb9Q03y","article":10118310,"buzz":"","division":"none","event":"NBA_Draft","fantasy":"none","gp_flag":"","league":"NBA","render_strategy":"slideshow","site":"NBA","tag_id":19,"tags":"NBA,NBA_Draft,NBA_Mock_Draft","team":"none","writer":"Jonathan Wasserman","zone":"slideshow"},"articles":{"tracks":[],"amp_url":"https://syndication.bleacherreport.com/amp/10118310-2024-nba-mock-draft-lottery-simulation-and-full-2-round-predictions.amp.html","author":{"id":"14977252","name":"Jonathan Wasserman","photo_url":"/images/users/br-user-default.png","title":"","twitter_handle":""},"author_gatekeeper_id":"2ac234aa-52f4-4a26-9b4f-23162c159acb","bet_tags":"19","breport_id":10118310,"contains_geoblocked_content":false,"description":"While the NBA lottery odds are set, the pingpong balls rarely give teams their projected order. Bleacher Report used Tankathon to simulate this week's mock…","elements":[{"content_type":"slide","elements":[{"content":{"credit":"Brian Rothmuller/Icon Sportswire via Getty Images","source_caption":"LOS ANGELES, CA - JANUARY 10: USC Trojans guard Isaiah Collier (1) drives to the basket against Washington State Cougars guard Myles Rice (2) during the college basketball game between the Washington State Cougars and the USC Trojans on January 10, 2024 at Galen Center in Los Angeles, CA. (Photo by Brian Rothmuller/Icon Sportswire via Getty Images)","source_credit":"Icon Sportswire","url":"https://media.bleacherreport.com/image/upload/x_272,y_77,w_1270,h_846,c_crop/v1714052653/hghcjo9qqu85bqjqh3dw.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"While the NBA lottery odds are set, the pingpong balls rarely give teams their projected order."},"content_type":"paragraph","id":"tVcg11cCOG"},{"content":{"html":"Bleacher Report used <a href=\"https://tankathon.com/\" rel=\"noopener\" target=\"_blank\">Tankathon</a> to simulate this week's mock draft order. It resulted in the Washington Wizards landing the No. 1 pick and the Houston Rockets making the biggest jump into the top four."},"content_type":"paragraph","id":"i1Rut5ffcW"},{"content":{"html":"That jump forces the Toronto Raptors to fall outside the top six and give up their protected pick to the San Antonio Spurs, who end up with two top-10 selections in this update."},"content_type":"paragraph","id":"uOT98nh9KH"},{"content":{"html":"April 27 was the deadline for prospects to declare for the draft, so anyone who hasn't already will be returning to college or choosing an alternate pro pathway."},"content_type":"paragraph","id":"KndNLcFWpx"},{"content":{"html":"NCAA prospects still have until May 29 to withdraw from the draft and return to college."},"content_type":"paragraph","id":"X4yyvG7tT2"},{"content_type":"hr_transparent","id":"fohgAODIO3"},{"content":{"html":"<i>*Some analysis in this article was previously published in last week's </i><a href=\"https://contenttools.bleacherreport.com/articles/slideshow/10116891\"><i>2024 NBA Mock Draft</i></a><i>.</i>"},"content_type":"paragraph","id":"XwcJy74BwL"}],"id":0,"slide_number":0,"title":"2024 NBA Mock Draft: Lottery Simulation and Full 2-Round Predictions","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Paul Kane/Getty Images","source_caption":"PERTH, AUSTRALIA - NOVEMBER 10: Alex Sarr of the Wildcats puts a shot up during the round seven NBL match between Perth Wildcats and New Zealand Breakers at RAC Arena, on November 10, 2023, in Perth, Australia. (Photo by Paul Kane/Getty Images)","source_credit":"Paul Kane","url":"https://media.bleacherreport.com/image/upload/x_0,y_241,w_1800,h_1198,c_crop/v1713975024/vafaqxaav0j1wnsa4t5q.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 1"},"content_type":"paragraph","id":"zLcrJp8Lb3"},{"content":{"html":"<b>Team</b>: Perth Wildcats"},"content_type":"paragraph","id":"JL0GtXIV4O"},{"content":{"html":"<b>Position</b>: PF/C"},"content_type":"paragraph","id":"JMirUsNR3L"},{"content":{"html":"<b>Size</b>: 7'1\", 216 lbs"},"content_type":"paragraph","id":"YfxXJjwW9b"},{"content":{"html":"<b>Age/Year</b>: 19"},"content_type":"paragraph","id":"nOHu7STpIf"},{"content":{"html":"<b>Nationality</b>: French"},"content_type":"paragraph","id":"hd-6gzIuQT"},{"content":{"html":"<b>Pro Comparison:</b> Jaren Jackson Jr."},"content_type":"paragraph","id":"YGf6QpGtef"},{"content":{"html":"The Washington Wizards' rebuild started at the bottom floor last draft. But it is still in the beginning stage where only selecting the best player available should matter, whether they win the lottery or fall outside the top five."},"content_type":"paragraph","id":"joafZ4tg3d"},{"content":{"html":"Alex Sarr may check both boxes for top talent and best fit with the Wizards. While the main draw to the 7'1\" Frenchman revolves around his switchable defense and shot-blocking, the ability to handle in the open floor, shoot with range and knock down pull-ups and fallaways separates him from other rim protectors."},"content_type":"paragraph","id":"A7MjOazXuq"},{"content":{"html":"The Wizards wouldn't have to worry about any positional logjam affecting prospects' development. Sarr would plug right in as the starting center and give the roster a second two-way cornerstone after Bilal Coulibaly to start fresh."},"content_type":"paragraph","id":"yjVfJas4-5"},{"content_type":"hr_transparent","id":"wAudToa7Vg"},{"content":{"html":"<i>*<a href=\"https://contenttools.bleacherreport.com/articles/slideshow/10112999\">Check out our full Alexandre Sarr 2024 NBA Draft Scouting Profile</a>.</i>"},"content_type":"paragraph","id":"RlfYO0yxUD"}],"id":1,"slide_number":1,"title":"1. Washington Wizards: Alex Sarr","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Seskim Photo/MB Media/Getty Images","source_caption":"ISTANBUL, TURKEY - JANUARY 2: Yam Madar (L) of Fenerbahce Beko Istanbul and Nikola Topic (R) of Crvena Zvezda Meridianbet Belgrade in action during the Turkish Airlines EuroLeague Regular Season Round 18 match between Fenerbahce Beko Istanbul and Crvena Zvezda Meridianbet Belgrade at Ulker Sports Arena on January 2, 2024 in Istanbul, Turkey. (Photo by Seskim Photo/MB Media/Getty Images)","source_credit":"Seskim Photo/MB Media","url":"https://media.bleacherreport.com/image/upload/v1713975560/freonsryit2ytc7f0fue.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 5"},"content_type":"paragraph","id":"hpQOTX_7rn"},{"content":{"html":"<b>Team</b>: KK Crvena Zvezda"},"content_type":"paragraph","id":"WsTFwffGwU"},{"content":{"html":"<b>Position</b>: PG"},"content_type":"paragraph","id":"HdGGDLOsPY"},{"content":{"html":"<b>Size</b>: 6'6\", 198 lbs"},"content_type":"paragraph","id":"ve6hNqGXDb"},{"content":{"html":"<b>Age/Year</b>: 18"},"content_type":"paragraph","id":"R7xN5YNnWn"},{"content":{"html":"<b>Nationality</b>: Serbian"},"content_type":"paragraph","id":"lNNTTdzR_W"},{"content":{"html":"<b>Pro Comparison: </b>Goran Dragić"},"content_type":"paragraph","id":"8JrWo1iwQk"},{"content":{"html":"After missing the last three months, Nikola Topić looked good in his return to Red Star, scoring eight points in under 16 minutes and generating a handful of assist opportunities."},"content_type":"paragraph","id":"TwlZzPRfba"},{"content":{"html":"More than anything else, the San Antonio Spurs will value his ability to create shots for teammates with his dribble manipulation, vision and advantageous 6'6\" size for passing. The Spurs also don't have a ball-handler who puts pressure on defenses and the rim like Topić. And it was promising to see him hit both of his three-point attempts in his first game back."},"content_type":"paragraph","id":"e5IOpd9Qx0"},{"content":{"html":"While his outside percentages have been underwhelming, he shows confidence and command stepping into jumpers, and his free-throw numbers have always been near or over 80.0 percent."},"content_type":"paragraph","id":"PHKr-bY6f4"},{"content":{"html":"Unless the Spurs question the translatability of his scoring or see more upside in a 6'8\" shotmaker like Zaccharie Risacher, Topić's production/comfort level overseas and his fit with Victor Wembanyama could give him an edge with San Antonio."},"content_type":"paragraph","id":"2O1NKTfCU0"}],"id":2,"slide_number":2,"title":"2. San Antonio Spurs: Nikola Topić","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Aurelien Meunier/Getty Images","source_caption":"NANTERRE, FRANCE - MARCH 23: Zaccharie Risacher of Bourg En Bresse drives to he basket during the BetClic Elite basketball match between Nanterre 92 and Bourg en Bresse at Palais Des Sports Maurice Thorez on March 23, 2024 in Nanterre, France.  (Photo by Aurelien Meunier/Getty Images)","source_credit":"Aurelien Meunier","url":"https://media.bleacherreport.com/image/upload/v1713980659/i10horo1rwaj0blclslj.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 4"},"content_type":"paragraph","id":"keDpjfVpCc"},{"content":{"html":"<b>Team</b>: JL Bourg-en-Bresse"},"content_type":"paragraph","id":"eqHpw8jyri"},{"content":{"html":"<b>Position</b>: SG/SF"},"content_type":"paragraph","id":"FTgh3u7x1U"},{"content":{"html":"<b>Size</b>: 6'8\", 204 lbs"},"content_type":"paragraph","id":"F6y6Gqm35n"},{"content":{"html":"<b>Age/Year</b>: 19"},"content_type":"paragraph","id":"R8w0B3Ad33"},{"content":{"html":"<b>Nationality</b>: French"},"content_type":"paragraph","id":"SZ1XHOXlhe"},{"content":{"html":"<b>Pro Comparison: </b>Harrison Barnes"},"content_type":"paragraph","id":"GKSCUltc0v"},{"content":{"html":"While Zaccharie Risacher will qualify as a best-player-available candidate at No. 3, he'd also plug an obvious hole on Detroit's wing with off-ball shotmaking."},"content_type":"paragraph","id":"FCoKS0LXMa"},{"content":{"html":"He'd fit nicely with the Pistons, playing alongside superior ball-handlers in Cade Cunningham and Jaden Ivey in the same spot-up-heavy role he plays now for JL Bourg. Aside from excelling in transition, he thrives as a catch-and-shoot scorer and straight-line slasher."},"content_type":"paragraph","id":"ampfEm5xic"},{"content":{"html":"The Pistons could also start Ausar Thompson and let Risacher experiment with more second-unit on-ball reps to improve his creation skill/confidence."},"content_type":"paragraph","id":"M1xbLvEbMQ"},{"content_type":"hr_transparent","id":"VI9AW0mRbD"},{"content":{"html":"*<a href=\"https://bleacherreport.com/articles/10114753-2024-nba-draft-zaccharie-risacher-scouting-report-pro-comparison-and-predictions\"><i>Check out our full Zaccharie Risacher 2024 NBA Draft Scouting Profile.</i></a>"},"content_type":"paragraph","id":"GQNfj7d2af"}],"id":3,"slide_number":3,"title":"3. Detroit Pistons: Zaccharie Risacher","user_gk_uuid":"acc3135c-a6a3-48f1-a274-69361c5c9b5a"},{"content_type":"slide","elements":[{"content":{"credit":"Justin K. Aller/NCAA Photos via Getty Images","source_caption":"PITTSBURGH, PENNSYLVANIA - MARCH 21: Reed Sheppard #15 of the Kentucky Wildcats puts up a shot over Blake Lampman #11 of the Oakland Golden Grizzlies in the second half during the first round of the 2024 NCAA Men's Basketball Tournament held at PPG PAINTS Arena on March 21, 2024 in Pittsburgh, Pennsylvania. (Photo by Justin K. Aller/NCAA Photos via Getty Images)","source_credit":"Justin K. Aller","url":"https://media.bleacherreport.com/image/upload/v1713981410/pddu3i4cnzodlsslu3ax.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 4"},"content_type":"paragraph","id":"OrHIkpGeCP"},{"content":{"html":"<b>Team</b>: Kentucky"},"content_type":"paragraph","id":"L9b5UOtmh2"},{"content":{"html":"<b>Position</b>: PG/SG"},"content_type":"paragraph","id":"_OlX0hNNOU"},{"content":{"html":"<b>Size</b>: 6'3\", 187 lbs"},"content_type":"paragraph","id":"_Vy7hNYxWc"},{"content":{"html":"<b>Age/Year</b>: 19, Freshman"},"content_type":"paragraph","id":"ZhY_CoVqP6"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"_N_12eIjrx"},{"content":{"html":"<b>Pro Comparison: </b>Kirk Hinrich"},"content_type":"paragraph","id":"7OxVjVQxzU"},{"content":{"html":"A year after drafting a pair of A+ athletes in Amen Thompson and Cam Whitmore, the Houston Rockets may be drawn to Reed Sheppard's 51.4 catch-and-shoot percentage."},"content_type":"paragraph","id":"vhTbAZPayP"},{"content":{"html":"He also hit 52.1 percent of his pull-ups and 9-of-15 floaters while averaging 6.2 assists per 40 minutes sharing the ball with Rob Dillingham and DJ Wagner. Sheppard has some hidden/untapped self-creation and playmaking ability that could show in Houston's second unit."},"content_type":"paragraph","id":"5YUsg6fvlb"},{"content":{"html":"Regardless, his floor-spacing would be an ideal fit alongside Thompson, who could also allow the 6'3\" Sheppard to defend smaller guards."},"content_type":"paragraph","id":"f83oX9owhF"},{"content_type":"hr_transparent","id":"NeY5hs5jDi"},{"content":{"html":"*<a href=\"https://bleacherreport.com/articles/10112023-reed-sheppard-scouting-report-pro-comps-and-predictions-for-2024-nba-draft-prospect\"><i>Check out our full Reed Sheppard 2024 NBA Draft Scouting Profile.</i></a>"},"content_type":"paragraph","id":"8Dl2otC1pl"}],"id":5,"slide_number":4,"title":"4. Houston Rockets (via Nets): Reed Sheppard ","user_gk_uuid":"acc3135c-a6a3-48f1-a274-69361c5c9b5a"},{"content_type":"slide","elements":[{"content":{"credit":"Jamie Schwaberow/NCAA Photos via Getty Images","source_caption":"GLENDALE, ARIZONA - APRIL 08: Donovan Clingan #32 of the Connecticut Huskies celebrates during the second half in the NCAA Men's Basketball Tournament National Championship game at State Farm Stadium on April 08, 2024 in Glendale, Arizona. (Photo by Jamie Schwaberow/NCAA Photos via Getty Images)","source_credit":"Jamie Schwaberow","url":"https://media.bleacherreport.com/image/upload/v1713993510/rwwjoheypwhiwee9nqo1.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 9"},"content_type":"paragraph","id":"7M8pY_wT0a"},{"content":{"html":"<b>Team</b>: Connecticut"},"content_type":"paragraph","id":"WgkcO4l-we"},{"content":{"html":"<b>Position</b>: C"},"content_type":"paragraph","id":"dXsuQmmLl4"},{"content":{"html":"<b>Size</b>: 7'2\", 280 lbs"},"content_type":"paragraph","id":"p64JjLAb0O"},{"content":{"html":"<b>Age/Year</b>: 20, Sophomore"},"content_type":"paragraph","id":"x0bX9RieMZ"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"u4XHRzx8OX"},{"content":{"html":"<b>Pro Comparison: </b>Rudy Gobert"},"content_type":"paragraph","id":"muQnYNDP4e"},{"content":{"html":"The Charlotte Hornets' defense ranked No. 29 in the NBA, which has likely already led to plenty of front-office chatter about Donovan Clingan."},"content_type":"paragraph","id":"I_CqaMgfE-"},{"content":{"html":"While Rob Dillingham's creativity may look enticing, he doesn't have the potential to help strengthen or change the team's identity like Clingan can with his 7'2\", 280-pound size and rim protection."},"content_type":"paragraph","id":"xdeRdMsLoM"},{"content":{"html":"And he should still add value offensively as another easy-basket target who'll earn Charlotte second-chance points."},"content_type":"paragraph","id":"EvqyAV5tAh"},{"content_type":"hr_transparent","id":"kUckq7fBFv"},{"content":{"html":"<i>*<a href=\"https://bleacherreport.com/articles/10113622-donovan-clingan-scouting-report-pro-comps-predictions-for-2024-nba-draft-prospect\">Check out our full Donovan Clingan 2024 NBA Draft Scouting Profile</a>.</i>"},"content_type":"paragraph","id":"TUszPl6Psx"}],"id":10,"slide_number":5,"title":"5. Charlotte Hornets: Donovan Clingan","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Set Number: X00004 TK1","source_caption":"College Basketball: NCAA Final Four: UConn Stephon Castle (5) in action, defends vs Purdue during the NCAA Men's Basketball Tournament National Championship game at State Farm Stadium. \nGlendale, AZ 4/8/2024 \nCREDIT: Greg Nelson (Photo by Greg Nelson/Sports Illustrated via Getty Images) \n(Set Number: X00004 TK1)","source_credit":"Greg Nelson","url":"https://media.bleacherreport.com/image/upload/v1714001102/b7e3tczmprbcf8su598f.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 5"},"content_type":"paragraph","id":"mpyDJOOi74"},{"content":{"html":"<b>Team</b>: Connecticut"},"content_type":"paragraph","id":"aikLwUBLlZ"},{"content":{"html":"<b>Position</b>: SG"},"content_type":"paragraph","id":"a893fL1fLA"},{"content":{"html":"<b>Size</b>: 6'6\", 215 lbs"},"content_type":"paragraph","id":"S76Ba-lSMP"},{"content":{"html":"<b>Age/Year</b>: 19, Freshman"},"content_type":"paragraph","id":"HGFlPQn0ze"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"_gM6ZCusry"},{"content":{"html":"<b>Pro Comparison: </b>Anthony Black"},"content_type":"paragraph","id":"4hUL-4j2QH"},{"content":{"html":"The Portland Trail Blazers will be in a tricky spot at draft time with young guards who need minutes and contractual commitments to forward Jerami Grant and center Deandre Ayton. Roster changes seem needed at some point, so fit shouldn't factor too much into the front office's decision."},"content_type":"paragraph","id":"qLFSWu1jDU"},{"content":{"html":"A mix of 6'6\" size, playmaking, lockdown defense and offensive rebounding represent differentiator skills and traits that make Stephon Castle and his archetype extra compelling."},"content_type":"paragraph","id":"Zy6NVR35Hc"},{"content":{"html":"Even without a jump shot, you could feel his impact in other ways during Connecticut's national title run, when he showcased his passing, tough driving, perimeter defense and knack for being in the right spots at the right times to finish plays."},"content_type":"paragraph","id":"3D8khsutdV"},{"content":{"html":"Improved shooting would unlock upside, though teams could still see a useful Swiss Army knife who won't need to make threes."},"content_type":"paragraph","id":"59bkL2QSh-"},{"content_type":"hr_transparent","id":"FQTHdPGdtN"},{"content":{"html":"<u><i>*<a href=\"https://bleacherreport.com/articles/10113723-stephon-castle-scouting-report-pro-comps-and-predictions-for-2024-nba-draft-prospect\">Check out our full Stephon Castle 2024 NBA Draft Scouting Profile</a></i></u>."},"content_type":"paragraph","id":"L2Z6PwQL9I"}],"id":11,"slide_number":6,"title":"6. Portland Trail Blazers: Stephon Castle","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Bryan Lynn/Icon Sportswire via Getty Images","source_caption":"KNOXVILLE, TN - MARCH 09: Kentucky Wildcats guard Rob Dillingham (0) controls the ball against Tennessee Volunteers guard Zakai Zeigler (5) during the college basketball game between the Tennessee Volunteers and the Kentucky Wildcats on March 9, 2024, at Food City Center in Knoxville, TN. (Photo by Bryan Lynn/Icon Sportswire via Getty Images)","source_credit":"Icon Sportswire","url":"https://media.bleacherreport.com/image/upload/v1713981994/hphr0dthgogzjxrczizv.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 2"},"content_type":"paragraph","id":"wUIwVcJOU7"},{"content":{"html":"<b>Team</b>: Kentucky"},"content_type":"paragraph","id":"y4iVary-gL"},{"content":{"html":"<b>Position</b>: PG/SG"},"content_type":"paragraph","id":"zhuccJM7-I"},{"content":{"html":"<b>Size</b>: 6'3\", 176 lbs"},"content_type":"paragraph","id":"F4nzVvAFwm"},{"content":{"html":"<b>Age/Year</b>: 19, Freshman"},"content_type":"paragraph","id":"WHkaTmrI6o"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"SSht8r2-dH"},{"content":{"html":"<b>Pro Comparison: </b>Darius Garland"},"content_type":"paragraph","id":"si3MMQVbGJ"},{"content":{"html":"The San Antonio Spurs will likely consider Rob Dillingham with their first pick, though Nikola Topić's 6'6\" size and superior playmaking could give him an edge for this particular roster."},"content_type":"paragraph","id":"VxkJFQ6uIH"},{"content":{"html":"Shot selection and defensive concerns could allow San Antonio to grab Dillingham with the Toronto Raptors' pick. He would give the Spurs lineup an additional ball-handler who also shot 47.8 percent off the catch, a good sign for his potential to play alongside a more natural point guard."},"content_type":"paragraph","id":"legqnd7Z_Z"},{"content":{"html":"There isn't a prospect in the draft with a more potent package of creativity and shotmaking. But scouts will be eager to learn his updated measurements, with Kentucky listing him at just 176 pounds."},"content_type":"paragraph","id":"f5IndwHqd2"},{"content_type":"hr_transparent","id":"xPY8dRZ1jY"},{"content":{"html":"<i>*<a href=\"https://bleacherreport.com/articles/10109564-rob-dillingham-scouting-report-pro-comps-and-predictions-for-2024-nba-draft-prospect\">Check out our full Rob Dillingham 2024 NBA Draft Scouting Profile.</a></i>"},"content_type":"paragraph","id":"Z5TjBh0XGV"}],"id":4,"slide_number":7,"title":"7. San Antonio Spurs (via Raptors): Rob Dillingham","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"David Becker/NBAE via Getty Images","source_caption":"HENDERSON, NV - JANUARY 29:  Ron Holland #0 of G League Ignite  goes to the basket during the game on January 29, 2024 at the Dollar Loan Center in Henderson, Nevada. NOTE TO USER: User expressly acknowledges and agrees that, by downloading and/or using this Photograph, user is consenting to the terms and conditions of the Getty Images License Agreement. Mandatory Copyright Notice: Copyright 2024 NBAE (Photo by David Becker/NBAE via Getty Images)","source_credit":"David Becker","url":"https://media.bleacherreport.com/image/upload/x_0,y_414,w_1800,h_1199,c_crop/v1713990111/mw0onobwnfe0cpsvg39l.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 7"},"content_type":"paragraph","id":"_hlI_qpyWg"},{"content":{"html":"<b>Team</b>: G League Ignite"},"content_type":"paragraph","id":"stGxfDcf4P"},{"content":{"html":"<b>Position</b>: SF"},"content_type":"paragraph","id":"e84uyaMrGO"},{"content":{"html":"<b>Size</b>: 6'6\", 204 lbs"},"content_type":"paragraph","id":"zzSQZR29XG"},{"content":{"html":"<b>Age/Year</b>: 18"},"content_type":"paragraph","id":"DSyZlkgiYQ"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"RAOlW3Sl0-"},{"content":{"html":"<b>Pro Comparison: </b>Cam Whitmore"},"content_type":"paragraph","id":"7Uyn8fbQDM"},{"content":{"html":"Ron Holland should find himself in the best-player-available conversation at No. 8, and the Grizzlies could deem him interchangeable with 6'6\" size, explosive athleticism and defensive quickness."},"content_type":"paragraph","id":"-e2r_6kXjT"},{"content":{"html":"At worst, he projects as a high-level energizer who'll provide rim pressure and finishing if nothing else improves. But over the course of the G League season, we saw enough signs of ball-handling and tough shotmaking for scouts to feel optimistic about his ability to develop more offensively in the half court."},"content_type":"paragraph","id":"33QVZzxXRP"},{"content_type":"hr_transparent","id":"5y7pnY_pkT"},{"content":{"html":"*<a href=\"https://bleacherreport.com/articles/10113135-ron-holland-ii-scouting-report-pro-comps-and-predictions-for-2024-nba-draft-prospect\"><i>Check out our full Ron Holland 2024 NBA Draft Profile</i></a>."},"content_type":"paragraph","id":"TGn-Qmgmsm"}],"id":8,"slide_number":8,"title":"8. Memphis Grizzlies: Ron Holland","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Aaron J. Thornton/Getty Images","source_caption":"DETROIT, MICHIGAN - MARCH 31: Dalton Knecht #3 of the Tennessee Volunteers attempts a shot during the first half of a NCAA Men's Basketball Tournament - Midwest Regional game against the Purdue Boilermakers at Little Caesars Arena on March 31, 2024 in Detroit, Michigan. (Photo by Aaron J. Thornton/Getty Images)","source_credit":"Aaron J. Thornton","url":"https://media.bleacherreport.com/image/upload/v1713992828/aevcup3sqnmh75qxkpk2.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 8"},"content_type":"paragraph","id":"78X9xdyz47"},{"content":{"html":"<b>Team</b>: Tennessee"},"content_type":"paragraph","id":"P-KvpUlSIT"},{"content":{"html":"<b>Position</b>: SG/SF"},"content_type":"paragraph","id":"FUFHuSAj7d"},{"content":{"html":"<b>Size</b>: 6'6\", 204 lbs"},"content_type":"paragraph","id":"p1psjcTjmd"},{"content":{"html":"<b>Age/Year</b>: 22, Senior"},"content_type":"paragraph","id":"miKogMuYQU"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"pUnVIFXHNj"},{"content":{"html":"<b>Pro Comparison: </b>Wally Szczerbiak"},"content_type":"paragraph","id":"bfL8z1VGXQ"},{"content":{"html":"Later in the lottery, teams may start to value certainty over upside. And Dalton Knecht is perceived as one of the surest bets on the board with 6'6\" size, elite shotmaking and huge scoring outputs against quality opponents, including 37 points against Purdue, 40 against Kentucky, 39 against Auburn, 31 against South Carolina, 39 against Florida and 37 against North Carolina."},"content_type":"paragraph","id":"_L6Lgu2dcL"},{"content":{"html":"Few players in the draft spent more time running off screens than Knecht. He has a skill and mentality that should create an easy fit and quick transition to the next level."},"content_type":"paragraph","id":"EwW9ovoCeH"}],"id":9,"slide_number":9,"title":"9. Utah Jazz: Dalton Knecht","user_gk_uuid":"ad7dcecb-2f27-48a1-887b-5e012e126aaf"},{"content_type":"slide","elements":[{"content":{"credit":"Jeff Bottari/NBAE via Getty Images","source_caption":"LAS VEGAS, NV - MARCH 22: Matas Buzelis #13 of G League Ignite  drives to the basket during the game against the Salt Lake City Stars on March 22, 2024 at The Dollar Loan Center in Henderson, Nevada. NOTE TO USER: User expressly acknowledges and agrees that, by downloading and or using this photograph, User is consenting to the terms and conditions of the Getty Images License Agreement. Mandatory Copyright Notice: Copyright 2024 NBAE (Photo by Jeff Bottari/NBAE via Getty Images)","source_credit":"Jeff Bottari","url":"https://media.bleacherreport.com/image/upload/x_0,y_388,w_1800,h_1199,c_crop/v1713990074/qnpaizc1moaefbebrmhw.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 10"},"content_type":"paragraph","id":"w4x7k5ARj4"},{"content":{"html":"<b>Team</b>: G League Ignite"},"content_type":"paragraph","id":"eDWSlsyCdH"},{"content":{"html":"<b>Position</b>: SF"},"content_type":"paragraph","id":"oMpe9SoVqb"},{"content":{"html":"<b>Size</b>: 6'8\", 209 lbs"},"content_type":"paragraph","id":"YlwHmkqmxJ"},{"content":{"html":"<b>Age/Year</b>: 19"},"content_type":"paragraph","id":"sArc_F12ur"},{"content":{"html":"<b>Nationality</b>: American/Lithuanian"},"content_type":"paragraph","id":"lHnGS3zTrz"},{"content":{"html":"<b>Pro Comparison:</b> Hedo Türkoğlu"},"content_type":"paragraph","id":"ej2vrX8Gfl"},{"content":{"html":"Matas Buzelis' G League reel highlights a coveted mix of big-wing size and scoring versatility from on and off the ball. His physical tools and perimeter skill set create an enticing archetype that could sway teams to reach and remain patient in spite of his inconsistency."},"content_type":"paragraph","id":"78j9Jn6sd0"},{"content":{"html":"Regarding his shooting, he'll have workouts to convince teams that his high school percentages were better indicators of his potential than his disappointing 27.3 three-point percentage with Ignite."},"content_type":"paragraph","id":"ecgYnw9NcR"},{"content_type":"hr_transparent","id":"eq5YQo0jnZ"},{"content":{"html":"<i>*<a href=\"https://bleacherreport.com/articles/10114607-matas-buzelis-scouting-report-pro-comps-and-predictions-for-2024-nba-draft-prospect\">Check out our full Matas Buzelis 2024 NBA Draft Scouting Report</a></i>."},"content_type":"paragraph","id":"y4vTK39nsL"}],"id":7,"slide_number":10,"title":"10. Atlanta Hawks: Matas Buzelis","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Mitchell Layton/Getty Images","source_caption":"INDIANAPOLIS, INDIANA - MARCH 24: Cody Williams #10 of the Colorado Buffaloes dribbles the ball during the Second Round NCAA Men's Basketball Tournament game against the Marquette Golden Eagles at Gainbridge Fieldhouse on March 24, 2024 in Indianapolis, Indiana. (Photo by Mitchell Layton/Getty Images)","source_credit":"Mitchell Layton","url":"https://media.bleacherreport.com/image/upload/x_0,y_112,w_1800,h_1199,c_crop/v1713988557/pcbhfblq6imnypn2agzv.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 11"},"content_type":"paragraph","id":"wF9spRQv32"},{"content":{"html":"<b>Team</b>: Colorado"},"content_type":"paragraph","id":"wrsU_BC4oE"},{"content":{"html":"<b>Position</b>: SF/PF"},"content_type":"paragraph","id":"cNRZZbPh-h"},{"content":{"html":"<b>Size</b>: 6'9\", 190 lbs"},"content_type":"paragraph","id":"ZsdApiSfVg"},{"content":{"html":"<b>Age/Year</b>: 19, Freshman"},"content_type":"paragraph","id":"dJn5S8nuS2"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"UBfvkswy4d"},{"content":{"html":"<b>Pro Comparison: </b>Jaden McDaniels"},"content_type":"paragraph","id":"mI4mKPWnKF"},{"content":{"html":"Cody Williams' off-ball scoring, efficient spot-up shooting and excellent defensive tools suggest he'll fit easily with an established, veteran core. Though not the most skilled offensive weapon or shotmaker, scouts admire his ability to score off teams' gravity, capitalize on spacing as a driver and play within the flow."},"content_type":"paragraph","id":"7cvlmB9wXd"},{"content":{"html":"He could go closer to top-five if teams see longer-term upside tied to his 6'9\" size, ball-screen flashes, three-point range and ability to guard multiple positions."},"content_type":"paragraph","id":"28IbT-Ks5w"},{"content_type":"hr_transparent","id":"iCuqVaMlxq"},{"content":{"html":"*<i><a href=\"https://bleacherreport.com/articles/10107232-cody-williams-scouting-report-pro-comps-and-predictions-for-2024-nba-draft-prospect\">Check out our full Cody Williams 2024 NBA Draft Scouting Profile</a>. </i>"},"content_type":"paragraph","id":"c7XFZy2rVO"}],"id":6,"slide_number":11,"title":"11. Chicago Bulls: Cody Williams","user_gk_uuid":"acc3135c-a6a3-48f1-a274-69361c5c9b5a"},{"content_type":"slide","elements":[{"content":{"credit":"Justin Ford/Getty Images","source_caption":"MEMPHIS, TENNESSEE - MARCH 22:  Ja'Kobe Walter #4 of the Baylor Bears reacts to a play in the first round of the NCAA Men's Basketball Tournament against the Colgate Raiders at FedExForum on March 22, 2024 in Memphis, Tennessee. (Photo by Justin Ford/Getty Images)","source_credit":"Justin Ford","url":"https://media.bleacherreport.com/image/upload/v1714046194/jbpaejhjm47qhaxnibii.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 19"},"content_type":"paragraph","id":"tYrekIyh25"},{"content":{"html":"<b>Team</b>: Baylor"},"content_type":"paragraph","id":"r2sa_wOiBl"},{"content":{"html":"<b>Position</b>: SG/SF"},"content_type":"paragraph","id":"BZWXSg6hMU"},{"content":{"html":"<b>Size</b>: 6'5\", 195 lbs"},"content_type":"paragraph","id":"vZtLs5yWf7"},{"content":{"html":"<b>Age/Year</b>: 19, Freshman"},"content_type":"paragraph","id":"oZAfWIm_zW"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"cAJtzPkkSf"},{"content":{"html":"<b>Pro Comparison: </b>Kentavious Caldwell-Pope"},"content_type":"paragraph","id":"37mRMRiyB5"},{"content":{"html":"After struggling during the Big 12 tournament, Ja'Kobe Walter scored 19 and 20 points against Colgate and Clemson, respectively, in the NCAAs. He showed exactly what the scouting report read all season: Catch-and-shoot shotmaking, physical line-driving and limited creativity off the dribble."},"content_type":"paragraph","id":"FANNsROQ--"},{"content":{"html":"In 35 games, he had 75 threes, 145 made free throws and just 50 assists—numbers that clearly reflect his strengths and weaknesses."},"content_type":"paragraph","id":"R9fXgZ9G1O"},{"content":{"html":"Walter figures to interest late-lottery to mid-first-round teams that could use more wing depth and see a three-and-D rotation player."},"content_type":"paragraph","id":"TfQu5r79Vh"}],"id":18,"slide_number":12,"title":"12. Oklahoma City Thunder (via Rockets): Ja'Kobe Walter","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Jack Dempsey/NCAA Photos via Getty Images","source_caption":"DALLAS, TEXAS - MARCH 31: Jared McCain #0 of the Duke Blue Devils looks to drive to the basket in a game against the North Carolina State Wolfpack during the Elite Eight round of the 2024 NCAA Men's Basketball Tournament held at American Airlines Center on March 31, 2024 in Dallas, Texas. (Photo by Jack Dempsey/NCAA Photos via Getty Images)","source_credit":"Jack Dempsey","url":"https://media.bleacherreport.com/image/upload/v1714004148/sh0ovuh7aha1ykzyq0ar.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 12"},"content_type":"paragraph","id":"VLYTrDrB82"},{"content":{"html":"<b>Team</b>: Duke"},"content_type":"paragraph","id":"qB31Zue7a1"},{"content":{"html":"<b>Position</b>: PG/SG"},"content_type":"paragraph","id":"tZkZQwR7K3"},{"content":{"html":"<b>Size</b>: 6'3\", 197 lbs"},"content_type":"paragraph","id":"G2Ah29EzqW"},{"content":{"html":"<b>Age/Year</b>: 20, Freshman"},"content_type":"paragraph","id":"ZHGiH-bUy2"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"Pume7tJTid"},{"content":{"html":"<b>Pro Comparison: </b>Immanuel Quickley"},"content_type":"paragraph","id":"eyJRGB0Uxl"},{"content":{"html":"North Carolina State's upset win over Duke overshadowed Jared McCain's 32-point game, which was the second time he went for 30-plus in the NCAA tournament."},"content_type":"paragraph","id":"I7Bob31XDY"},{"content":{"html":"He's become one of the draft's most convincing shotmakers, and though his size and athletic limitations do raise questions, he's shown plenty of ways to compensate with his crafty ball-handling and pace, shooting versatility, touch shots in the lane and finishing adjustments."},"content_type":"paragraph","id":"O_DAuoNrvG"},{"content":{"html":"Teams will view McCain as either a scoring combo and secondary playmaker or offensive spark to bring off the bench."},"content_type":"paragraph","id":"wfKa7mT2Zr"}],"id":13,"slide_number":13,"title":"13. Sacramento Kings: Jared McCain","user_gk_uuid":"2ac234aa-52f4-4a26-9b4f-23162c159acb"},{"content_type":"slide","elements":[{"content":{"credit":"David Berding/Getty Images","source_caption":"MINNEAPOLIS, MINNESOTA - MARCH 14: Kel'el Ware #1 of the Indiana Hoosiers reacts to his dunk against the Penn State Nittany Lions\\ in the first half in the Second Round of the Big Ten Tournament at Target Center on March 14, 2024 in Minneapolis, Minnesota. (Photo by David Berding/Getty Images)","source_credit":"David Berding","url":"https://media.bleacherreport.com/image/upload/v1714046070/tlwy4zveukrxjqpmvffb.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 18"},"content_type":"paragraph","id":"pfqM498BQ1"},{"content":{"html":"<b>Team</b>: Indiana"},"content_type":"paragraph","id":"GSzOa8tmCn"},{"content":{"html":"<b>Position</b>: C"},"content_type":"paragraph","id":"7yamopCMMf"},{"content":{"html":"<b>Size</b>: 7'0\", 242 lbs"},"content_type":"paragraph","id":"YxsJsOZMXj"},{"content":{"html":"<b>Age/Year</b>: 20, Sophomore"},"content_type":"paragraph","id":"DqxfEDNeKS"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"Jgl-MTwB8k"},{"content":{"html":"<b>Pro Comparison: </b>Brook Lopez"},"content_type":"paragraph","id":"FAo1mt7DP6"},{"content":{"html":"It seems like Kel'el Ware can only rise during a pre-draft process that will highlight his outstanding measurements, athleticism and comfort level shooting threes."},"content_type":"paragraph","id":"vGd7POoRaM"},{"content":{"html":"Though he struggled during Indiana's finale and loss to Nebraska, he mostly had a strong last two months in terms of scoring and impact."},"content_type":"paragraph","id":"xXhsrjuCuC"},{"content":{"html":"Narratives that point out empty stats or low-impact production have lost steam. He delivered more consistently in one-on-one situations around the basket while also flashing bonus shotmaking touch and range that create more offensive upside."},"content_type":"paragraph","id":"XqCLCovAnO"}],"id":16,"slide_number":14,"title":"14. Portland Trail Blazers (via Warriors) Kel'el Ware","user_gk_uuid":"acc3135c-a6a3-48f1-a274-69361c5c9b5a"},{"content_type":"slide","elements":[{"content":{"credit":"Ric Tapia/Icon Sportswire via Getty Images","source_caption":"LOS ANGELES, CA - FEBRUARY 24: USC Trojans guard Isaiah Collier (1) signals during a college basketball game against the UCLA Bruins on February 24, 2024 at Pauley Pavilion in Los Angeles, CA. (Photo by Ric Tapia/Icon Sportswire via Getty Images)","source_credit":"Icon Sportswire","url":"https://media.bleacherreport.com/image/upload/v1714010192/jqflmupo0qao8ouozlwx.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 15"},"content_type":"paragraph","id":"w5K1rd3Pi-"},{"content":{"html":"<b>Team</b>: USC"},"content_type":"paragraph","id":"XyxE_LTXif"},{"content":{"html":"<b>Position</b>: PG"},"content_type":"paragraph","id":"gcCCrSLIrL"},{"content":{"html":"<b>Size</b>: 6'5\", 210 lbs"},"content_type":"paragraph","id":"xEV_mSaWSy"},{"content":{"html":"<b>Age/Year</b>: 19, Freshman"},"content_type":"paragraph","id":"MlVHPslgHv"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"nYgoCtLq75"},{"content":{"html":"<b>Pro Comparison: </b>Tyreke Evans"},"content_type":"paragraph","id":"RBVkKqjIqR"},{"content":{"html":"The strength of the point guard position in the NBA could cause Isaiah Collier to fall out of the lottery. Teams may be reluctant to draft a backup ball-handler near the top 10, but at some point, he should look like a best player available who's too difficult to pass on."},"content_type":"paragraph","id":"U0nm-kCa07"},{"content":{"html":"The combination of strength and shiftiness separates Collier from other playmakers. The question is whether he'll improve his shot and decision-making, and if not, how much will his shooting limitations and turnovers devalue his game."},"content_type":"paragraph","id":"-je1g_iCB_"},{"content":{"html":"Even if there isn't a starting spot open for Collier, his creativity and rim pressure should be well suited for a bench-spark role."},"content_type":"paragraph","id":"5l9mKYtw92"},{"content_type":"hr_transparent","id":"a2pltfWJ3P"},{"content":{"html":"*<a href=\"https://bleacherreport.com/articles/10113945-isaiah-collier-scouting-report-pro-comps-and-predictions-for-2024-nba-draft-prospect\"><i>Check out our Full Isaiah Collier 2024 NBA Draft Scouting Report</i></a>."},"content_type":"paragraph","id":"vJ-InLsT37"}],"id":15,"slide_number":15,"title":"15. Miami Heat: Isaiah Collier","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Lance King/Getty Images","source_caption":"DALLAS, TEXAS - MARCH 29: Kyle Filipowski #30 of the Duke Blue Devils puts up a three-point shot against the Houston Cougars during the second half in the Sweet Sixteen round of the NCAA Men's Basketball Tournament at American Airlines Center on March 29, 2024 in Dallas, Texas. (Photo by Lance King/Getty Images)","source_credit":"Lance King","url":"https://media.bleacherreport.com/image/upload/v1714009199/vxtk67lzf1lx7xfb0a5r.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 14"},"content_type":"paragraph","id":"43jg2vXQFU"},{"content":{"html":"<b>Team</b>: Duke"},"content_type":"paragraph","id":"PPqvM5KNdW"},{"content":{"html":"<b>Position</b>: PF/C"},"content_type":"paragraph","id":"haaH8KmXEB"},{"content":{"html":"<b>Size</b>: 7'0\", 248 lbs"},"content_type":"paragraph","id":"5Mam7n19ya"},{"content":{"html":"<b>Age/Year</b>: 20, Sophomore"},"content_type":"paragraph","id":"GRIQxy9H8G"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"9H-HmUzTyg"},{"content":{"html":"<b>Pro Comparison: </b>Santi Aldama"},"content_type":"paragraph","id":"KpOI3e9z6a"},{"content":{"html":"A strong sophomore season for Kyle Filipowski ended in disappointing fashion in the Elite Eight, with his three-point shot not falling and North Carolina State's physical bigs forcing tougher two-point attempts."},"content_type":"paragraph","id":"fRqu37iQPo"},{"content":{"html":"But the biggest scouting takeaway was that he struggled defensively to contain DJ Burns Jr.'s strength and footwork in the post. It served as a reminder that Filipowski should be better suited to play the 4 most nights in the NBA."},"content_type":"paragraph","id":"JFXbBLu2M0"},{"content":{"html":"Overall, his draft stock remains relatively unchanged after he hit three threes against Houston and totaled eight assists through the tournament's first two rounds. Shooting range, post skill, improved finishing and passing and defensive mobility create versatility that should lock Filipowski into the late-lottery/mid-first-round range."},"content_type":"paragraph","id":"xPDFrUy9TL"},{"content":{"html":"While he doesn't project as a top option like he was at Duke, he checks the right complementary boxes to make a quick transition to a supporting stretch 4 or 5 role."},"content_type":"paragraph","id":"hfxvffdC9n"},{"content_type":"hr_transparent","id":"VQ6t8Pj0qr"},{"content":{"html":"*<a href=\"https://bleacherreport.com/articles/10112095-kyle-filipowski-scouting-report-pro-comps-predictions-for-2024-nba-draft-prospect\"><i>Check out our Full Kyle Filipowski 2024 NBA Draft Scouting Report</i></a>."},"content_type":"paragraph","id":"oovq2YCf8D"}],"id":14,"slide_number":16,"title":"16. Philadelphia 76ers: Kyle Filipowski","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Fred Kfoury III/Icon Sportswire via Getty Images","source_caption":"BOSTON, MA - MARCH 30: Illinois Fighting Illini guard Terrence Shannon Jr. (0) dribbles up court during the NCAA Elite Eight, East Regional Final between the UCONN Huskies and the Illinois Fighting Illini on March 30, 2024, at TD Garden in Boston, Massachusetts. (Photo by Fred Kfoury III/Icon Sportswire via Getty Images)","source_credit":"Icon Sportswire","url":"https://media.bleacherreport.com/image/upload/v1714046142/g331iapzuhcm88ugbpmk.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 17"},"content_type":"paragraph","id":"p_eGTdBlzY"},{"content":{"html":"<b>Team</b>: Illinois"},"content_type":"paragraph","id":"4SyN7BAV9V"},{"content":{"html":"<b>Position</b>: SG/SF"},"content_type":"paragraph","id":"Ys4yHv2-ly"},{"content":{"html":"<b>Size</b>: 6'6\", 225 lbs"},"content_type":"paragraph","id":"q3CCjohP1C"},{"content":{"html":"<b>Age/Year</b>: 23, Senior"},"content_type":"paragraph","id":"ux6UPwc2AL"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"nT6s6sJE9-"},{"content":{"html":"<b>Pro Comparison: </b>Kelly Oubre Jr."},"content_type":"paragraph","id":"bVnhTf-d7B"},{"content":{"html":"Front offices will debate Terrence Shannon Jr.'s speed, slashing, shotmaking improvement and defensive tools versus age, streaky shooting and a reliance on high usage and athleticism. Their investigation into rape allegations will be the most important part of pre-draft homework."},"content_type":"paragraph","id":"9iuSaMvrdA"},{"content":{"html":"Illinois recently decided to <a href=\"https://www.wcia.com/news/u-of-i-drops-investigation-of-shannon-jr-takes-no-disciplinary-action/?utm_campaign=socialflow&amp;utm_medium=referral&amp;utm_source=facebook.com&amp;utm_campaign=socialflow&amp;utm_medium=referral&amp;utm_source=t.co\" rel=\"noopener\" target=\"_blank\">drop its investigation</a>, citing insufficient evidence. However, a criminal case in Kansas remains open, and Shannon will have an important hearing on May 10."},"content_type":"paragraph","id":"qrUQeT9V3a"},{"content":{"html":"The results will obviously be critical for his draft stock, as will each team's own findings. Otherwise, his on-court development, which resulted in 23.0 points and 2.4 threes per game, has earned him lottery grades."},"content_type":"paragraph","id":"Tu5tuExU5X"}],"id":17,"slide_number":17,"title":"17. New Orleans Pelicans (via Lakers): Terrence Shannon Jr.","user_gk_uuid":"acc3135c-a6a3-48f1-a274-69361c5c9b5a"},{"content_type":"slide","elements":[{"content":{"credit":"Mitchell Layton/Getty Images","source_caption":"NEW YORK, NY - MARCH 14:  Devin Carter #22 of the Providence Friars drives to the basket during the Quarterfinals of the Big East Basketball Tournament against the Creighton Bluejays at Madison Square Garden on March 14, 2024 in New York City. (Photo by Mitchell Layton/Getty Images)","source_credit":"Mitchell Layton","url":"https://media.bleacherreport.com/image/upload/v1713993630/bzsyn19qx9tocd51ebhy.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 12"},"content_type":"paragraph","id":"csvYlQsaXg"},{"content":{"html":"<b>Team</b>: Providence"},"content_type":"paragraph","id":"p7LjCCL5Az"},{"content":{"html":"<b>Position</b>: PG/SG"},"content_type":"paragraph","id":"ix1sLZQRVw"},{"content":{"html":"<b>Size</b>: 6'3\", 195 lbs"},"content_type":"paragraph","id":"EQSUWFFpVl"},{"content":{"html":"<b>Age/Year</b>: 22, Junior"},"content_type":"paragraph","id":"NIkyeldK-_"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"HBUe5djyY1"},{"content":{"html":"<b>Pro Comparison: </b>Derrick White"},"content_type":"paragraph","id":"VuGpdIknRB"},{"content":{"html":"Devin Carter was quick to announce his decision to enter the draft after a breakout year showing significant offensive improvement, a needle-mover for one of the nation's top perimeter defenders."},"content_type":"paragraph","id":"-ixTkzDtbY"},{"content":{"html":"He closed the year with another outstanding performance, putting up 27 points on 14 shots against Marquette."},"content_type":"paragraph","id":"JOYBZFwWei"},{"content":{"html":"Regardless of the scoring outbursts this year, he's going to earn NBA minutes and paychecks off versatility and intangibles. For a 6'3\" guard, the 32 blocked shots and 8.7 rebounds per game are telling."},"content_type":"paragraph","id":"UNkVXMFr0H"},{"content":{"html":"Unteachable defensive intensity, toughness and instincts separate Carter and fuel his identity, though he's entered the lottery conversation by developing into a dangerous shot-maker and crafty pick-and-roll ball-handler."},"content_type":"paragraph","id":"BElXfOu53k"}],"id":12,"slide_number":18,"title":"18. Orlando Magic: Devin Carter","user_gk_uuid":"acc3135c-a6a3-48f1-a274-69361c5c9b5a"},{"content_type":"slide","elements":[{"content":{"credit":"Cooper Neill/NBAE via Getty Images","source_caption":"FRISCO, TX - FEBRUARY 27: Tyler Smith #11 of the G League Ignite dunks the ball during the game against the Texas Legends on February 27, 2024 at Comerica Center in Frisco, Texas. NOTE TO USER: User expressly acknowledges and agrees that, by downloading and or using this photograph, User is consenting to the terms and conditions of the Getty Images License Agreement. Mandatory Copyright Notice: Copyright 2023 NBAE (Photo by Cooper Neill/NBAE via Getty Images)","source_credit":"Cooper Neill","url":"https://media.bleacherreport.com/image/upload/v1714046228/io2hcbnzfjw104o4o06c.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot: </b>No. 20"},"content_type":"paragraph","id":"9NxbRbZ6lj"},{"content":{"html":"<b>Team:</b> Ignite"},"content_type":"paragraph","id":"-E6PHmbNQR"},{"content":{"html":"<b>Position: </b>PF"},"content_type":"paragraph","id":"cfx9_FBYj8"},{"content":{"html":"<b>Size: </b>6'11\", 224 lbs"},"content_type":"paragraph","id":"nsEn8jZBaG"},{"content":{"html":"<b>Age:</b> 19"},"content_type":"paragraph","id":"T2jOl8sfUd"},{"content":{"html":"<b>Nationality:</b> American"},"content_type":"paragraph","id":"Ipi8L7L6ap"},{"content":{"html":"<b>Pro comparison: </b>Channing Frye"},"content_type":"paragraph","id":"zIAIQLPYBU"},{"content":{"html":"There will be a long list of teams trying to get Tyler Smith in for workouts. His production and shooting this year felt unexpected, but it earned scouts' attention, given the obvious appeal to a 6'11\" forward who made 58 threes in 43 games."},"content_type":"paragraph","id":"C9s7IF0sNx"},{"content":{"html":"There are some questions about his defensive upside and whether he'll be a threat to put the ball on the floor. In the mid-to-late first round, though, there should be enough teams interested in just adding a surefire, frontcourt shotmaker and finisher."},"content_type":"paragraph","id":"Ak0hr5FQ7V"}],"id":19,"slide_number":19,"title":"19. Toronto Raptors (via Pacers): Tyler Smith","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Ben Solomon/NCAA Photos via Getty Images","source_caption":"INDIANAPOLIS, INDIANA - MARCH 24: Tristan da Silva #23 of the Colorado Buffaloes looks to pass the ball against the Marquette Golden Eagles during the second round of the 2024 NCAA Men's Basketball Tournament held at Gainbridge Fieldhouse on March 24, 2024 in Indianapolis, Indiana. (Photo by Ben Solomon/NCAA Photos via Getty Images)","source_credit":"Ben Solomon","url":"https://media.bleacherreport.com/image/upload/v1714072184/v4y4swqhxnyepndxopui.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot: </b>No. 16"},"content_type":"paragraph","id":"OHylko8WC3"},{"content":{"html":"<b>School/team:</b> Colorado"},"content_type":"paragraph","id":"IekQv_VEEP"},{"content":{"html":"<b>Position:</b> SF/PF"},"content_type":"paragraph","id":"pG5cQ8yYeE"},{"content":{"html":"<b>Size: </b>6'9\", 220 lbs"},"content_type":"paragraph","id":"ZMAh3Age77"},{"content":{"html":"<b>Age/Year:</b> 22, Senior"},"content_type":"paragraph","id":"e4hFTw4Zap"},{"content":{"html":"<b>Nationality:</b> German/Brazilian"},"content_type":"paragraph","id":"DKFm1PYCeN"},{"content":{"html":"<b>Pro comparison:</b> Kyle Kuzma"},"content_type":"paragraph","id":"dYUKiGRoB8"},{"content":{"html":"A strong three-game NCAA tournament (18.0 PPG, 60.0 percent FG) helped Tristan da Silva continue to sell his scoring versatility and IQ for passing and defense."},"content_type":"paragraph","id":"TeNfmmdV2v"},{"content":{"html":"The lack of explosiveness and physicality brings down his perceived ceiling, but he's too big, skilled and efficient for it to matter outside the lottery."},"content_type":"paragraph","id":"SC-Ni-tMSN"},{"content":{"html":"Regardless of how much his athletic limitations hold him back, teams can bank on his shooting, passing and overall discipline."},"content_type":"paragraph","id":"NYb4g3_Rul"}],"id":20,"slide_number":20,"title":"20. Cleveland Cavaliers: Tristan da Silva","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"metadata":{"start_seconds":21,"video_id":"v8kCrvv2bCc"},"url":""},"content_type":"youtube_video"},{"content":{"html":"<b>Previous Mock Draft Spot: </b>No. 22"},"content_type":"paragraph","id":"gM20fmmQmN"},{"content":{"html":"<b>Team:</b><b> </b>Cholet"},"content_type":"paragraph","id":"FInYjTzj7s"},{"content":{"html":"<b>Position:</b> PF"},"content_type":"paragraph","id":"U7OSlGapgT"},{"content":{"html":"<b>Size: </b>6'9\", 212 lbs"},"content_type":"paragraph","id":"kkjz4XUvgp"},{"content":{"html":"<b>Age: </b>18"},"content_type":"paragraph","id":"Laz1wThuCs"},{"content":{"html":"<b>Nationality:</b> French"},"content_type":"paragraph","id":"R_kljBK5pH"},{"content":{"html":"<b>Pro comparison:</b> Obi Toppin"},"content_type":"paragraph","id":"DhhCRSN8Eu"},{"content":{"html":"Tidjane Salaun continues to trade productive games with off ones, but scouts will surely put more stock into the 18-year-old's production and flashes over the inconsistency."},"content_type":"paragraph","id":"eN10vJM0bH"},{"content":{"html":"Despite the hot and cold shooting, he's still scored in double figures in four of his last five games, showing he can attack closeouts and use his mobility and tools for play-finishing off the ball."},"content_type":"paragraph","id":"1qdRLsnbjt"},{"content":{"html":"Still, it's the shotmaking for a 6'9\" forward that's going to earn him top-20 looks. He's now made 68 threes in 48 games while converting 82.7 percent of his free throws."},"content_type":"paragraph","id":"LRl7uiKfM8"}],"id":21,"slide_number":21,"title":"21. New Orleans Pelicans (via Bucks): Tidjane Salaun","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Jay Biggerstaff/Getty Images","source_caption":"KANSAS CITY, MISSOURI - MARCH 15: Yves Missi #21 of the Baylor Bears dunks against Robert Jones #12 of the Iowa State Cyclones during the second half of a semifinal game of the Big 12 Men's Basketball Tournament at T-Mobile Center on March 15, 2024 in Kansas City, Missouri.  (Photo by Jay Biggerstaff/Getty Images)","source_credit":"Jay Biggerstaff","url":"https://media.bleacherreport.com/image/upload/v1714047601/szzjwacygcactuj2clcf.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot: </b>No. 21"},"content_type":"paragraph","id":"So2WMR76uM"},{"content":{"html":"<b>School: </b>Baylor"},"content_type":"paragraph","id":"ZU2Hnj0SAG"},{"content":{"html":"<b>Position: </b>C"},"content_type":"paragraph","id":"1p08bTT84I"},{"content":{"html":"<b>Size: </b>7'0\", 235 lbs"},"content_type":"paragraph","id":"0rX4T8asHH"},{"content":{"html":"<b>Age/Year: </b>19, Freshman"},"content_type":"paragraph","id":"h0Zi2YMYfp"},{"content":{"html":"<b>Nationality: </b>Cameroon"},"content_type":"paragraph","id":"Kf9IovCGDl"},{"content":{"html":"<b>Pro comparison:</b> Mark Williams"},"content_type":"paragraph","id":"M_RXLSsoDs"},{"content":{"html":"Yves Missi would give the Phoenix Suns a different looks from Jusuf Nurkić with how well he slides laterally and elevates above the rim."},"content_type":"paragraph","id":"Swz9EMuVCO"},{"content":{"html":"His physical tools, athleticism and archetype are traditionally translatable to rim protection and finishing, though he also flashed some face-up scoring skill as the season went on, attacking his man in space."},"content_type":"paragraph","id":"gKV-MRz9zI"}],"id":22,"slide_number":22,"title":"22. Phoenix Suns: Yves Missi","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Brett Wilhelm/NCAA Photos via Getty Images","source_caption":"GLENDALE, ARIZONA - APRIL 08: (EDITORS NOTE: Image taken using a remote camera.) Zach Edey #15 of the Purdue Boilermakers dunks the ball against the Connecticut Huskies during the second half in the NCAA Men's Basketball Tournament National Championship game at State Farm Stadium on April 08, 2024 in Glendale, Arizona. (Photo by Brett Wilhelm/NCAA Photos via Getty Images)","source_credit":"Brett Wilhelm","url":"https://media.bleacherreport.com/image/upload/v1714047934/uv765fsqwwflndufgb34.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot: </b>No. 23"},"content_type":"paragraph","id":"0pgXcu20Fz"},{"content":{"html":"<b>School/team: </b>Purdue"},"content_type":"paragraph","id":"F6V2uVqqS3"},{"content":{"html":"<b>Position:</b> C"},"content_type":"paragraph","id":"hUoMBOUw6n"},{"content":{"html":"<b>Size: </b>7'4\", 300 lbs"},"content_type":"paragraph","id":"UzDK66qFtK"},{"content":{"html":"<b>Age:</b> 21, Senior"},"content_type":"paragraph","id":"UIK0N7YD2d"},{"content":{"html":"<b>Nationality:</b> Canadian"},"content_type":"paragraph","id":"CGOQwv4hjH"},{"content":{"html":"<b>Pro comparison: </b>Jonas Valančiūnas"},"content_type":"paragraph","id":"PJ8KSyg0Q3"},{"content":{"html":"With a 37-point effort in the national championship game, Zach Edey finished Purdue's NCAA tournament run averaging 29.5 points."},"content_type":"paragraph","id":"IhMS161RL_"},{"content":{"html":"It will be interesting to see his updated weight at this year's NBA combine after he came in at 306.4 pounds last May."},"content_type":"paragraph","id":"EFnEOQ-4e-"},{"content":{"html":"He's changed a number of minds regarding his pro outlook and potential to carve out an NBA role, even without adding any modern skills. His combination of 7'4\" height and one-handed touch creates a tremendous advantage in the post. And improved mobility has led to increased, quicker defensive court coverage around the key."},"content_type":"paragraph","id":"qEiZaVe19P"},{"content":{"html":"As we saw against Connecticut's Donovan Clingan, he could still be predictable playing with his back to the basket. And NBA offenses will have an obvious game plan to put him in ball-screen situations and pull him away from the basket. Connecticut picked up two big second-half baskets against him as he failed to retreat back to the rim to contest the roll man."},"content_type":"paragraph","id":"PknrVXXgOi"},{"content":{"html":"Still, Edey should still be able to justify consideration in the teens or 20s for a team that could use more easy baskets, physicality inside and shot-blocking."},"content_type":"paragraph","id":"yjOlV8FmAU"}],"id":23,"slide_number":23,"title":"23. Milwaukee Bucks (via Pelicans): Zach Edey","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Christian Petersen/Getty Images","source_caption":"SALT LAKE CITY, UTAH - MARCH 23: Johnny Furphy #10 of the Kansas Jayhawks handles the ball against Nolan Hickman #11 of the Gonzaga Bulldogs during the first half in the second round of the NCAA Men's Basketball Tournament at Delta Center on March 23, 2024 in Salt Lake City, Utah. (Photo by Christian Petersen/Getty Images)","source_credit":"Christian Petersen","url":"https://media.bleacherreport.com/image/upload/v1714047974/sp5migsdgkt2exxnjsx9.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 24"},"content_type":"paragraph","id":"_MCkT0zmDi"},{"content":{"html":"<b>Team</b>: Kansas"},"content_type":"paragraph","id":"vEXJeFYbw2"},{"content":{"html":"<b>Position</b>: SF"},"content_type":"paragraph","id":"vq_vXlBfqd"},{"content":{"html":"<b>Size</b>: 6'9\", 202 lbs"},"content_type":"paragraph","id":"12EJWqBhWX"},{"content":{"html":"<b>Age/Year</b>: 19, Freshman"},"content_type":"paragraph","id":"YR8kYoHCL0"},{"content":{"html":"<b>Nationality</b>: Australian"},"content_type":"paragraph","id":"X-fs-w0NKp"},{"content":{"html":"<b>Pro Comparison: </b>Cam Johnson"},"content_type":"paragraph","id":"pB8uNRD3DV"},{"content":{"html":"Johnny Furphy has scored an invite to Australia's preliminary national team for the Paris Olympics. He's earned fans this year with a combination of 6'9\" size, shooting, play-finishing and intangibles that point to an easy off-ball fit for any lineup."},"content_type":"paragraph","id":"Lse58hVNbd"},{"content":{"html":"He may ultimately be more appealing to established, competitive rosters that can afford to wait on his physical development and aren't concerned about upside."},"content_type":"paragraph","id":"tYGnXrpqJO"}],"id":24,"slide_number":24,"title":"24. New York Knicks (via Mavericks): Johnny Furphy","user_gk_uuid":"acc3135c-a6a3-48f1-a274-69361c5c9b5a"},{"content_type":"slide","elements":[{"content":{"credit":"David Buono/Icon Sportswire via Getty Images","source_caption":"WACO, TX - MARCH 02: Kansas Jayhawks guard Kevin McCullar Jr. (15) races up court with the ball during the Big 12 college basketball game between Baylor Bears and Kansas Jayhawks on March 2, 2024, at Foster Pavilion in Waco, TX. (Photo by David Buono/Icon Sportswire via Getty Images)","source_credit":"Icon Sportswire","url":"https://media.bleacherreport.com/image/upload/x_0,y_396,w_1800,h_1199,c_crop/v1714048017/o9tsug82cznqmvdzquhy.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot: </b>No. 25"},"content_type":"paragraph","id":"1QY70D0OmU"},{"content":{"html":"<b>School/team:</b> Kansas"},"content_type":"paragraph","id":"ceoU6NvyR2"},{"content":{"html":"<b>Position:</b> SG/SF"},"content_type":"paragraph","id":"9cZc-6ymys"},{"content":{"html":"<b>Size: </b>6'7\", 214 lbs"},"content_type":"paragraph","id":"bFb5Q7gwlK"},{"content":{"html":"<b>Age:</b> 23, Senior"},"content_type":"paragraph","id":"Hhw5DACq1b"},{"content":{"html":"<b>Nationality:</b> American"},"content_type":"paragraph","id":"KCWxMy7n_F"},{"content":{"html":"<b>Pro comparison:</b> Josh Hart"},"content_type":"paragraph","id":"Nw3OZ3mjHc"},{"content":{"html":"Kansas ruled Kevin McCullar Jr. out for the NCAA tournament before it started, and the conversation heading into pre-draft now revolves around his knee."},"content_type":"paragraph","id":"BetZjjXhce"},{"content":{"html":"The Jayhawks looked like a different team without him, which speaks to his impact and wide-ranging contributions getting Kansas into offense, finishing plays, making shots and defending opponents' top wings."},"content_type":"paragraph","id":"25adNkBaUb"},{"content":{"html":"Scouts buy his versatility and defense for a supporting NBA role, though he'll have to avoid any medical-report concerns."},"content_type":"paragraph","id":"ytkNrZFd60"}],"id":25,"slide_number":25,"title":"25. New York Knicks: Kevin McCullar Jr.","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"Samuel Lewis/Icon Sportswire via Getty Images","source_caption":"CORAL GABLES, FL - FEBRUARY 24: Miami guard Kyshawn George (7) brings the ball up court in the first half as the Miami Hurricanes faced the Georgia Tech Yellow Jackets on February 24, 2024, at the Watsco Center in Coral Gables, Florida. (Photo by Samuel Lewis/Icon Sportswire via Getty Images)","source_credit":"Icon Sportswire","url":"https://media.bleacherreport.com/image/upload/v1714072153/y7g4gkbpkbdgleadlcpp.jpg","user_caption":""},"content_type":"image","isLeadImage":true},{"content":{"html":"<b>Previous Mock Draft Spot</b>: No. 26"},"content_type":"paragraph","id":"NUjgBHfPYa"},{"content":{"html":"<b>Team</b>: Miami"},"content_type":"paragraph","id":"76dhy_xXkv"},{"content":{"html":"<b>Position</b>: SG/SF"},"content_type":"paragraph","id":"rN4EQuIbPF"},{"content":{"html":"<b>Size</b>: 6'8\", 205 lbs"},"content_type":"paragraph","id":"yLt3ptvhLg"},{"content":{"html":"<b>Age/Year</b>: 20, Freshman"},"content_type":"paragraph","id":"7EQgS_Ms91"},{"content":{"html":"<b>Nationality</b>: American"},"content_type":"paragraph","id":"03i4s2Dk4e"},{"content":{"html":"<b>Pro Comparison: </b>Dalano Banton"},"content_type":"paragraph","id":"7qx4VZs4H-"},{"content":{"html":"The combination of 6'8\" size, 40.8 percent three-point shooting, ball-handling and passing skills create an archetype and intrigue that Kyshawn George may ride into the first round."},"content_type":"paragraph","id":"ve1u6mrQ_S"},{"content":{"html":"Zero explosion and a 46.7 two-point percentage does hint at some bust potential. It wouldn't be surprising if he was advised to skip scrimmaging at the combine and continue to sell his fluidity and shot during workouts."},"content_type":"paragraph","id":"TFI6-HWKYr"}],"id":26,"slide_number":26,"title":"26. Washington Wizards (via Clippers): Kyshawn George","user_gk_uuid":"18f09b2e-9a52-45c3-8051-939f9b93fd7b"},{"content_type":"slide","elements":[{"content":{"credit":"C. Morgan Engel/NCAA Photos via Getty Images","source_caption":"LOS ANGELES, CALIFORNIA - MARCH 28: Harrison Ingram #55 of the North Carolina Tar Heels goes for the rebound against the Alabama Crimson Tide during the Sweet Sixteen round of the 2024 NCAA Men's Basketball Tournament held at Crypto.com Arena on March 28, 2024 in Los Angeles, California. (Photo by C. Morgan Engel/NCAA Photos via Getty Images)","source_credit":"C. Morgan Engel
